<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYARAEZ: Little World</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <h1>KYARAEZ</h1>
      <p>Little World</p>
      <div class="loader"></div>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="main-menu" class="screen hidden">
    <div class="menu-container">
      <h1 class="game-title">KYARAEZ</h1>
      <p class="game-subtitle">Little World</p>

      <div class="menu-buttons">
        <button id="btn-new-game" class="btn primary">Mulai Baru</button>
        <button id="btn-continue" class="btn">Lanjutkan</button>
        <button id="btn-multiplayer" class="btn">Multiplayer (Room)</button>
        <button id="btn-settings" class="btn secondary">Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- Character Creator -->
  <div id="character-creator" class="screen hidden">
    <div class="creator-wrapper">

      <!-- Preview Karakter -->
      <div class="creator-preview">
        <div class="character-preview" id="character-preview">
          <div class="char-hair" id="preview-hair"></div>
          <div class="char-face" id="preview-face">
            <div class="char-eyes" id="preview-eyes"></div>
            <div class="char-mouth"></div>
          </div>
          <div class="char-body" id="preview-body"></div>
        </div>
        <p class="preview-name" id="preview-name">Namamu</p>
      </div>

      <!-- Panel Customize -->
      <div class="creator-panel">
        <h2>Buat Karaktermu</h2>

        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="input-name" placeholder="Masukkan nama..." maxlength="16" />
        </div>

        <div class="form-group">
          <label>Tipe Karakter</label>
          <div class="option-row">
            <button class="option-btn active" data-type="child">Anak / Teen</button>
            <button class="option-btn" data-type="adult">Dewasa</button>
          </div>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="option-row">
            <button class="option-btn active" data-gender="female">Perempuan</button>
            <button class="option-btn" data-gender="male">Laki-laki</button>
          </div>
        </div>

        <div class="form-group">
          <label>Warna Kulit</label>
          <div class="color-row" id="skin-colors">
            <button class="color-btn active" data-color="#fce2c4" style="background:#fce2c4"></button>
            <button class="color-btn" data-color="#f5cba7" style="background:#f5cba7"></button>
            <button class="color-btn" data-color="#e0ac69" style="background:#e0ac69"></button>
            <button class="color-btn" data-color="#c68642" style="background:#c68642"></button>
            <button class="color-btn" data-color="#8d5524" style="background:#8d5524"></button>
          </div>
        </div>

        <div class="form-group">
          <label>Warna Rambut</label>
          <div class="color-row" id="hair-colors">
            <button class="color-btn active" data-color="#2c1a0e" style="background:#2c1a0e"></button>
            <button class="color-btn" data-color="#6b3a2a" style="background:#6b3a2a"></button>
            <button class="color-btn" data-color="#d4a017" style="background:#d4a017"></button>
            <button class="color-btn" data-color="#e8b4bc" style="background:#e8b4bc"></button>
            <button class="color-btn" data-color="#4a90a4" style="background:#4a90a4"></button>
            <button class="color-btn" data-color="#222222" style="background:#222222"></button>
          </div>
        </div>

        <div class="form-group">
          <label>Gaya Rambut</label>
          <div class="option-row" id="hair-styles">
            <button class="option-btn active" data-hair="short">Pendek</button>
            <button class="option-btn" data-hair="long">Panjang</button>
            <button class="option-btn" data-hair="curly">Keriting</button>
            <button class="option-btn" data-hair="ponytail">Kuncir</button>
          </div>
        </div>

        <div class="form-group">
          <label>Warna Baju</label>
          <div class="color-row" id="clothes-colors">
            <button class="color-btn active" data-color="#ff8fab" style="background:#ff8fab"></button>
            <button class="color-btn" data-color="#a0e7e5" style="background:#a0e7e5"></button>
            <button class="color-btn" data-color="#b5e48c" style="background:#b5e48c"></button>
            <button class="color-btn" data-color="#ffd6a5" style="background:#ffd6a5"></button>
            <button class="color-btn" data-color="#c77dff" style="background:#c77dff"></button>
            <button class="color-btn" data-color="#48cae4" style="background:#48cae4"></button>
          </div>
        </div>

        <div class="creator-actions">
          <button id="btn-cancel-creator" class="btn secondary">Batal</button>
          <button id="btn-finish-creator" class="btn primary">Selesai & Main</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game World -->
  <div id="game-world" class="screen hidden">
    <div class="hud">
      <div class="hud-left">
        <div class="time-display">
          <span id="game-time">07:30</span>
          <span id="game-day">Senin</span>
        </div>
        <div class="weather-display">
          <span id="weather-icon">☀️</span>
          <span id="weather-text">Cerah</span>
        </div>
      </div>

      <div class="hud-center">
        <div class="needs">
          <div class="need" title="Energi">⚡ <span id="need-energy">100</span></div>
          <div class="need" title="Lapar">🍞 <span id="need-hunger">100</span></div>
          <div class="need" title="Kebersihan">🛁 <span id="need-hygiene">100</span></div>
          <div class="need" title="Mood">😊 <span id="need-mood">100</span></div>
        </div>
      </div>

      <div class="hud-right">
        <div class="money-display">
          💰 <span id="player-money">1.250</span>
        </div>
        <button id="btn-save" class="btn-icon" title="Simpan Game">💾</button>
        <button id="btn-menu" class="btn-icon" title="Menu">☰</button>
      </div>
    </div>

    <div id="world-container">
      <div class="world-placeholder">
        <div class="mini-character" id="world-character">
          <div class="char-hair"></div>
          <div class="char-face">
            <div class="char-eyes"></div>
            <div class="char-mouth"></div>
          </div>
          <div class="char-body"></div>
        </div>
        <p id="world-greeting">Selamat datang di Little World!</p>
        <p class="hint">Tekan 💾 untuk menyimpan progress</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/main.js"></script>
</body>
</html>
