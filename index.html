<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYARAEZ: Little World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loading-screen">
    <div class="loading-content">
      <h1>KYARAEZ</h1>
      <p>Little World</p>
      <div class="loader"></div>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div id="main-menu" class="screen hidden">
    <div class="menu-container">
      <h1 class="game-title">KYARAEZ</h1>
      <p class="game-subtitle">Little World</p>
      <div class="menu-buttons">
        <button id="btn-new-game" class="btn primary">Mulai Baru</button>
        <button id="btn-continue" class="btn">Lanjutkan</button>
        <button id="btn-multiplayer" class="btn">Multiplayer (Room)</button>
        <button id="btn-settings" class="btn secondary">Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- CHARACTER CREATOR -->
  <div id="character-creator" class="screen hidden">
    <div class="creator-card">
      <div class="creator-left">
        <img id="avatar-preview" class="avatar-big" src="" alt="avatar" />
        <p id="preview-name" class="preview-name">Namamu</p>
      </div>
      <div class="creator-right">
        <h2>Buat Karakter</h2>

        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="input-name" maxlength="16" placeholder="Ketik nama..." />
        </div>

        <div class="form-group">
          <label>Tipe</label>
          <div class="option-row">
            <button class="option-btn active" data-type="child">Anak / Teen</button>
            <button class="option-btn" data-type="adult">Dewasa</button>
          </div>
        </div>

        <div class="form-group">
          <label>Style Avatar</label>
          <div class="option-row">
            <button class="option-btn active" data-style="adventurer">Adventurer</button>
            <button class="option-btn" data-style="lorelei">Lorelei</button>
            <button class="option-btn" data-style="avataaars">Avataaars</button>
            <button class="option-btn" data-style="big-smile">Big Smile</button>
          </div>
        </div>

        <div class="form-group">
          <label>Seed (ubah wajah)</label>
          <div class="seed-row">
            <input type="text" id="input-seed" placeholder="bebas, contoh: kyara" />
            <button id="btn-random-seed" class="btn small">Random</button>
          </div>
        </div>

        <div class="creator-actions">
          <button id="btn-cancel-creator" class="btn secondary">Batal</button>
          <button id="btn-finish-creator" class="btn primary">Selesai & Main</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-world" class="screen hidden">
    <div class="hud">
      <div class="hud-left">
        <div class="time-box">
          <span id="game-time">07:30</span>
          <span id="game-day">Senin</span>
        </div>
        <div class="weather-box">
          <span id="weather-icon">☀️</span>
          <span id="weather-text">Cerah</span>
        </div>
      </div>

      <div class="hud-center">
        <div class="need-item">⚡ <span id="need-energy">100</span></div>
        <div class="need-item">🍞 <span id="need-hunger">100</span></div>
        <div class="need-item">🛁 <span id="need-hygiene">100</span></div>
        <div class="need-item">😊 <span id="need-mood">100</span></div>
      </div>

      <div class="hud-right">
        <div class="money-box">💰 <span id="player-money">1250</span></div>
        <button id="btn-save" class="btn-icon">💾</button>
        <button id="btn-menu" class="btn-icon">☰</button>
      </div>
    </div>

    <div class="game-body">
      <div class="location-tabs">
        <button class="loc-btn active" data-loc="home">🏠 Rumah</button>
        <button class="loc-btn" data-loc="cafe">☕ Cafe</button>
        <button class="loc-btn" data-loc="market">🛒 Supermarket</button>
        <button class="loc-btn" data-loc="work">💼 Kerja</button>
      </div>

      <div class="scene">
        <div class="scene-left">
          <img id="player-avatar" class="avatar-mid" src="" alt="player" />
          <p id="player-label" class="player-label">Player</p>
          <p id="location-desc" class="location-desc">Kamu di rumah.</p>
        </div>

        <div class="scene-right">
          <h3 id="location-title">Rumah</h3>
          <div id="action-list" class="action-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="script.js"></script>
</body>
</html>
